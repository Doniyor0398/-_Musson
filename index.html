<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ресторан Муссон — Генератор этикеток</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
            color: #1e1e1e;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ТОСТЫ */
        .toast {
            position: fixed;
            top: 20px;
            z-index: 9999;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 360px;
            padding: 16px 18px 20px;
            border-radius: 14px;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.18);
            animation: toastIn 0.4s ease-out;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .toast--show {
            opacity: 1;
            pointer-events: auto;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast--chef {
            left: 20px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-left: 6px solid #dc2626;
        }

        .toast--director {
            right: 20px;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            border-left: 6px solid #2563eb;
        }

        .toast__icon {
            font-size: 28px;
            flex-shrink: 0;
            line-height: 1;
        }

        .toast__content {
            flex: 1;
        }

        .toast__title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .toast--chef .toast__title {
            color: #7f1d1d;
        }

        .toast--director .toast__title {
            color: #1e3a8a;
        }

        .toast__text {
            font-size: 12.5px;
            line-height: 1.4;
        }

        .toast--chef .toast__text {
            color: #78350f;
        }

        .toast--director .toast__text {
            color: #1e40af;
        }

        .toast__progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            transform-origin: left;
            transform: scaleX(0);
        }

        .toast--show .toast__progress {
            animation: progress 4s linear forwards;
        }

        .toast__progress--chef {
            background: #dc2626;
        }

        .toast__progress--director {
            background: #2563eb;
        }

        @keyframes progress {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }

        /* ОСНОВНОЙ ИНТЕРФЕЙС */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1e1e1e;
        }

        .header p {
            color: #666;
            margin-top: 4px;
            font-size: 14px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
            margin-top: 14px;
        }

        label:first-of-type {
            margin-top: 0;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            background: #fafafa;
            transition: border-color 0.2s;
        }

        select:focus,
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #6366f1;
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #4f46e5;
        }

        .btn--secondary {
            background: #1e1e1e;
            margin-top: 10px;
        }

        .btn--secondary:hover {
            background: #333;
        }

        /* ПРЕДПРОСМОТР ЭТИКЕТКИ (Стиль AVERO MIO) */
        .label-preview {
            background: white;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.3;
            width: 100%;
            max-width: 58mm;
            margin: 0 auto;
            border: 1px dashed #ccc;
            color: #000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label-header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 4px;
        }

        .label-header h3 {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .label-header p {
            font-size: 9px;
            margin: 1px 0;
        }

        .label-product h4 {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .label-product p {
            margin: 1px 0;
        }

        .label-dates {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 10px;
        }

        .label-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 4px;
            border-top: 1px dashed #000;
            padding-top: 4px;
        }

        .eac-mark {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .preview-wrapper {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            min-height: 200px;
            align-items: flex-start;
            overflow-y: auto;
            max-height: 600px;
        }

        .hint {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 12px;
            line-height: 1.5;
        }

        .history {
            margin-top: 20px;
            font-size: 13px;
        }

        .history h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        .history-item {
            padding: 6px 10px;
            background: #f5f5f5;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 12px;
            color: #444;
            display: flex;
            justify-content: space-between;
        }

        /* ПЕЧАТЬ */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .header,
            .card,
            .btn,
            .history,
            .hint,
            .preview-wrapper>* {
                display: none !important;
            }

            .preview-wrapper {
                background: white;
                padding: 0;
                min-height: auto;
                overflow: visible;
            }

            .label-preview {
                display: block !important;
                position: absolute;
                top: 0;
                left: 0;
                margin: 0;
                padding: 4px;
                border: none;
                width: 58mm;
                font-size: 11px;
                box-shadow: none;
            }

            @page {
                size: 58mm 80mm;
                margin: 0;
            }

            /* Высота этикетки 80мм, при необходимости поменяй */
        }

        @media (max-width: 760px) {
            .toast {
                max-width: calc(100vw - 40px);
                left: 20px;
                right: 20px;
            }

            .toast--director {
                top: 170px;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ====== ДАННЫЕ КОМПАНИИ ======
        const COMPANY_INFO = {
            name: 'РЕСТОРАН МУССОН',
            legalName: 'ООО "НОВЫЕ ФОРМЫ"',
            urAddress: 'юр. адрес: 127006, г. Москва, ул. Петровка, д. 34, стр. 1',
            factAddress: 'факт. адрес: 127006, г. Москва, ул. Петровка, д. 34, стр. 1',
        };

        // ====== СПИСОК СОТРУДНИКОВ (из журнала) ======
        const EMPLOYEES = [
            'Тешабаев Рауф', 'Хамдамова Исроил', 'Никопаев Виктор', 'Алексеев Денис',
            'Багрянов', 'Кишканов Казы', 'Суянич', 'Аскарова Тасилупу', 'Насырова Казы',
            'Эшураев', 'Иванов Илья', 'Дониёрбек', 'Абдураупов', 'Вапнярович',
            'Худайова Аминжон', 'Никопаев', 'Чирков Дмитрий', 'Эшнбек уулу Мирлан',
            'Гуров Алексей', 'Пирсевич'
        ];

        // ====== БАЗА ПРОДУКТОВ ======
        const PRODUCTS = [
            { id: 1, name: 'Лазанья п/ф', hours: 96, portion: 220, ingredients: 'Фарш Больонезе п/ф, Огузок п/ф, Томаты в собственном соку, Морковь очищенная п/ф', protein: 13.486, fat: 19.575, carbs: 17.601, calories: 301, cost: 0, quantity: '1 Кг' },
            { id: 2, name: 'Гратен Картофельный п/ф', hours: 96, portion: 90, ingredients: 'Картофель очищенный п/ф, Соус Бешамель Сливочный п/ф, Молоко 3.5%, Масло растительное п/ф', protein: 7.545, fat: 18.159, carbs: 20.745, calories: 277, cost: 0, quantity: '1 Кг' },
            { id: 3, name: 'Лосось филе П/Ф', hours: 24, portion: 100, ingredients: 'Лосось, соль', protein: 20, fat: 6, carbs: 0, calories: 150, cost: 0, quantity: '1 Кг' },
            { id: 4, name: 'Креветка 16/20', hours: 24, portion: 100, ingredients: 'Креветка, вода, соль', protein: 18, fat: 1, carbs: 0, calories: 90, cost: 0, quantity: '1 Кг' },
            { id: 5, name: 'Соус Спайси', hours: 72, portion: 50, ingredients: 'Майонез, соус Шрирача, кунжут', protein: 2, fat: 20, carbs: 5, calories: 200, cost: 0, quantity: '1 Кг' },
        ];

        // ====== УТИЛИТЫ ======
        const pad = (n) => String(n).padStart(2, '0');
        const formatDate = (date) => {
            const d = pad(date.getDate());
            const m = pad(date.getMonth() + 1);
            const y = date.getFullYear();
            const hh = pad(date.getHours());
            const mm = pad(date.getMinutes());
            return `${d}.${m}.${y}, ${hh}:${mm}`;
        };
        const formatShort = (date) => {
            const d = pad(date.getDate());
            const m = pad(date.getMonth() + 1);
            const y = date.getFullYear();
            const hh = pad(date.getHours());
            const mm = pad(date.getMinutes());
            return `${d}.${m}.${y} ${hh}:${mm}`;
        };
        const toDateTimeLocal = (date) => {
            const d = pad(date.getDate());
            const m = pad(date.getMonth() + 1);
            const y = date.getFullYear();
            const hh = pad(date.getHours());
            const mm = pad(date.getMinutes());
            return `${y}-${m}-${d}T${hh}:${mm}`;
        };

        // ====== МОДАЛЬНЫЕ ОКНА ======
        function ChefModal({ onClose }) {
            useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, [onClose]);
            return (
                <div className="toast toast--chef toast--show">
                    <div className="toast__icon">🛡️</div>
                    <div className="toast__content">
                        <div className="toast__title">Проверка СанПиН? Не страшно.</div>
                        <div className="toast__text">Этикетки соответствуют СанПиН 2.3/2.4.3590-20. ФИО, дата, срок и температура — фиксируются автоматически.</div>
                    </div>
                    <div className="toast__progress toast__progress--chef"></div>
                </div>
            );
        }

        function DirectorModal({ onClose }) {
            useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, [onClose]);
            return (
                <div className="toast toast--director toast--show">
                    <div className="toast__icon">💰</div>
                    <div className="toast__content">
                        <div className="toast__title">Экономия времени и денег</div>
                        <div className="toast__text"><strong>~100 минут в день</strong> освобождается у поваров. Меньше ошибок — меньше списаний. Окупается за месяц.</div>
                    </div>
                    <div className="toast__progress toast__progress--director"></div>
                </div>
            );
        }

        // ====== ГЛАВНЫЙ КОМПОНЕНТ ======
        function App() {
            const [selectedId, setSelectedId] = useState(PRODUCTS[0].id);
            const [startDate, setStartDate] = useState(toDateTimeLocal(new Date()));
            const [selectedEmployee, setSelectedEmployee] = useState(() => localStorage.getItem('employee') || EMPLOYEES[0]);
            const [temperature, setTemperature] = useState(() => localStorage.getItem('temp') || '+2');
            const [history, setHistory] = useState(() => { try { return JSON.parse(localStorage.getItem('labelHistory') || '[]'); } catch { return []; } });
            const [showChef, setShowChef] = useState(true);
            const [showDirector, setShowDirector] = useState(true);

            const product = PRODUCTS.find(p => p.id === selectedId);

            const expirationDate = (() => {
                const d = new Date(startDate);
                if (isNaN(d)) return null;
                d.setTime(d.getTime() + product.hours * 60 * 60 * 1000);
                return d;
            })();

            useEffect(() => { localStorage.setItem('employee', selectedEmployee); }, [selectedEmployee]);
            useEffect(() => { localStorage.setItem('temp', temperature); }, [temperature]);

            const handlePrint = () => {
                const entry = { product: product.name, start: formatShort(new Date(startDate)), end: expirationDate ? formatShort(expirationDate) : '—', chef: selectedEmployee || '—', time: new Date().toISOString() };
                const newHistory = [entry, ...history].slice(0, 20);
                setHistory(newHistory);
                localStorage.setItem('labelHistory', JSON.stringify(newHistory));
                window.print();
            };

            return (
                <div className="app">
                    {showChef && <ChefModal onClose={() => setShowChef(false)} />}
                    {showDirector && <DirectorModal onClose={() => setShowDirector(false)} />}

                    <div className="header">
                        <h1>🏷️ {COMPANY_INFO.name}</h1>
                        <p>{COMPANY_INFO.legalName}</p>
                    </div>

                    <div className="layout">
                        {/* ЛЕВАЯ КОЛОНКА: ФОРМА */}
                        <div className="card">
                            <h2>Данные этикетки</h2>

                            <label>Продукт</label>
                            <select value={selectedId} onChange={e => setSelectedId(Number(e.target.value))}>
                                {PRODUCTS.map(p => <option key={p.id} value={p.id}>{p.name} ({p.hours} ч.)</option>)}
                            </select>

                            <label>Дата и время изготовления (Упаковано)</label>
                            <input type="datetime-local" value={startDate} onChange={e => setStartDate(e.target.value)} />

                            <label>Исполнитель (ФИО)</label>
                            <select value={selectedEmployee} onChange={e => setSelectedEmployee(e.target.value)}>
                                {EMPLOYEES.map((emp, i) => <option key={i} value={emp}>{emp}</option>)}
                            </select>

                            <label>Температура холодильника</label>
                            <input type="text" value={temperature} onChange={e => setTemperature(e.target.value)} placeholder="+2" />

                            <button className="btn btn--secondary" onClick={handlePrint}>🖨️ Напечатать этикетку</button>
                            <p className="hint">Кнопка откроет диалог печати. Размер этикетки: 58×80 мм.</p>
                        </div>

                        {/* ПРАВАЯ КОЛОНКА: ПРЕДПРОСМОТР */}
                        <div className="card">
                            <h2>Предпросмотр</h2>
                            <div className="preview-wrapper">
                                <div className="label-preview">
                                    <div className="label-header">
                                        <h3>{COMPANY_INFO.name}</h3>
                                        <p>{COMPANY_INFO.legalName}</p>
                                        <p>{COMPANY_INFO.urAddress}</p>
                                        <p>{COMPANY_INFO.factAddress}</p>
                                    </div>
                                    <div className="label-product">
                                        <h4>{product.name} п/ф 1 пор={product.portion} гр</h4>
                                        <p>Состав: {product.ingredients}</p>
                                        <p>Белки: {product.protein}, Жиры: {product.fat}, Углеводы: {product.carbs}, Энерг. ценность: {product.calories} Ккал</p>
                                        <p>Стоимость: {product.cost}</p>
                                        <p>Кол-во: {product.quantity}</p>
                                    </div>
                                    <div className="label-dates">
                                        <span>Упаковано: {formatDate(new Date(startDate))}</span>
                                        <span>Годен до: {expirationDate ? formatDate(expirationDate) : '—'}</span>
                                    </div>
                                    <div className="label-footer">
                                        <div>
                                            <p>Исполнитель</p>
                                            <p>{selectedEmployee || '—'}</p>
                                        </div>
                                        <div className="eac-mark">EAC</div>
                                    </div>
                                </div>
                            </div>
                            <div className="history">
                                <h3>Последние этикетки</h3>
                                {history.length === 0 && <div style={{ color: '#999', fontSize: 12 }}>Пока ничего не напечатано</div>}
                                {history.map((h, i) => <div key={i} className="history-item"><span>{h.product}</span><span>до {h.end}</span></div>)}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
